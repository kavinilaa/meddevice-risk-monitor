version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: meddevice-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: medical_device_prediction
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: meddevice-backend
    restart: always
    environment:
      - DATABASE_URL=mysql+pymysql://root:root@mysql:3306/medical_device_prediction
      - JWT_SECRET_KEY=meddevice_risk_monitor_jwt_secret_key_hackathon_2026_super_secure
      - MODEL_PATH=ml/medical_device_xgboost_13features.pkl
      - FRONTEND_URL=http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: meddevice-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mysql_data:
